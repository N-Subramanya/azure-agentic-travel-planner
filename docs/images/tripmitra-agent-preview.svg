<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="intro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3b4c"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- browser frame -->
  <rect x="0" y="0" width="1200" height="760" rx="14" fill="#e2e8f0"/>
  <rect x="0" y="0" width="1200" height="44" rx="14" fill="#cbd5e1"/>
  <rect x="0" y="30" width="1200" height="14" fill="#cbd5e1"/>
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="22" r="6" fill="#22c55e"/>
  <rect x="300" y="11" width="600" height="22" rx="11" fill="#f8fafc"/>
  <text x="600" y="27" text-anchor="middle" font-size="13" fill="#64748b">rag-app.azurewebsites.net/agent</text>

  <!-- page -->
  <rect x="0" y="44" width="1200" height="716" fill="#f7f9fc"/>
  <rect x="0" y="44" width="1200" height="56" fill="#ffffff"/>
  <!-- TripMitra logo (same as static/images/logo.svg, scaled to 28px) -->
  <g transform="translate(30 58) scale(0.4375)">
    <rect width="64" height="64" rx="14" fill="url(#intro)"/>
    <circle cx="45" cy="19" r="8" fill="#ff7a18"/>
    <path d="M28 52 C28 52 14 37 14 27 a14 14 0 0 1 28 0 C42 37 28 52 28 52 Z" fill="#ffffff"/>
    <circle cx="28" cy="27" r="5.5" fill="#ff7a18"/>
  </g>
  <text x="70" y="79" font-size="19" font-weight="700" fill="#2c3e50">TripMitra</text>
  <text x="890" y="78" font-size="14" fill="#1e88e5">💬 Ask (RAG)</text>
  <text x="1010" y="78" font-size="14" fill="#1e88e5">🤖 Trip Planner (Agent)</text>

  <!-- intro -->
  <rect x="150" y="120" width="900" height="74" rx="12" fill="url(#intro)"/>
  <text x="174" y="152" font-size="22" font-weight="700" fill="#ffffff">🤖 AI Trip Planner</text>
  <text x="174" y="178" font-size="14" fill="#d1fae5">An agent that decides which tools to use: it searches our brochures, checks real weather and estimates your budget.</text>

  <!-- user bubble -->
  <rect x="450" y="212" width="600" height="46" rx="12" fill="#ff7a18"/>
  <text x="472" y="241" font-size="15" fill="#ffffff">Plan 4 days in Ladakh for 2 people in June, budget ₹80,000</text>

  <!-- agent steps -->
  <rect x="150" y="274" width="810" height="78" rx="10" fill="#eef6f3" stroke="#cfe7dc"/>
  <text x="168" y="298" font-size="14" font-weight="700" fill="#2c3e50">🧠 Agent steps</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#2c3e50">
    <rect x="166" y="310" width="262" height="28" rx="6" fill="#ffffff" stroke="#d6dde5"/>
    <text x="178" y="329">🔎 search_brochures(query=Ladakh)</text>
    <rect x="438" y="310" width="300" height="28" rx="6" fill="#ffffff" stroke="#d6dde5"/>
    <text x="450" y="329">🌤️ get_weather(city=Leh, IN, month=6)</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#2c3e50">
    <rect x="748" y="310" width="200" height="28" rx="6" fill="#ffffff" stroke="#d6dde5"/>
    <text x="760" y="329">💰 estimate_budget(…)</text>
  </g>

  <!-- answer -->
  <rect x="150" y="368" width="810" height="360" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <text x="174" y="402" font-size="17" font-weight="700" fill="#2c3e50">🏔️ 4-Day Ladakh Itinerary (June)</text>
  <g font-size="14.5" fill="#334155">
    <text x="174" y="434"><tspan font-weight="700">Day 1:</tspan> Arrive in Leh, rest and acclimatise; evening at Shanti Stupa</text>
    <text x="174" y="460"><tspan font-weight="700">Day 2:</tspan> Leh Palace, Thiksey &amp; Hemis monasteries</text>
    <text x="174" y="486"><tspan font-weight="700">Day 3:</tspan> Day trip to Pangong Lake via Chang La</text>
    <text x="174" y="512"><tspan font-weight="700">Day 4:</tspan> Magnetic Hill &amp; Sangam viewpoint, then depart</text>
  </g>
  <line x1="174" y1="532" x2="936" y2="532" stroke="#e2e8f0"/>
  <text x="174" y="560" font-size="15" font-weight="700" fill="#2c3e50">🌤️ Weather</text>
  <text x="174" y="584" font-size="14.5" fill="#334155">Leh in June: ~21°C days, ~8°C nights, few rainy days. Pack layers, a warm jacket and sunscreen.</text>
  <text x="174" y="618" font-size="15" font-weight="700" fill="#2c3e50">💰 Budget</text>
  <text x="174" y="642" font-size="14.5" fill="#334155">Estimated ₹64,000 for 2 people (mid-range, excluding flights): within your ₹80,000 budget ✅</text>
  <line x1="174" y1="664" x2="936" y2="664" stroke="#e2e8f0"/>
  <text x="174" y="692" font-size="14" font-weight="700" fill="#2c3e50">📎 Sources:</text>
  <text x="262" y="692" font-size="14" fill="#1e88e5">Ladakh.pdf</text>

</svg>
