<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Konaseema Travels</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f7f9fc;
        }
    </style>
</head>

<body>

    <header style="background:transparent; padding:12px 20px; position:fixed; width:100%; z-index:50; top:0;">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Konaseema Travels" style="height:36px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.2);">
            <div style="font-weight:700; color:#ffffff; text-shadow:0 1px 3px rgba(0,0,0,0.6);">Konaseema Travels</div>
        </div>
    </header>

    {% block content %}{% endblock %}

</body>
</html>
