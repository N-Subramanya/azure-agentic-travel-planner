{% extends "base.html" %}
{% block content %}

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
    }

    .wrapper {
        display: flex;
        justify-content: center;
        align-items: stretch;
        min-height: 100vh;
        background-image: url('{{ url_for('static', filename='images/hero.svg') }}?v=2');
        background-size: cover;
        background-position: center center;
        position: relative;
        color: #fff;
        padding-top: 72px; /* account for fixed header */
    }

    .wrapper::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
        z-index: 0;
    }

    .homePage {
        text-align: center;
        max-width: 900px;
        width: 100%;
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: calc(100vh - 160px);
        padding: 100px 0 40px;
    }


    .title {
        font-size: 42px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 12px;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .subtitle {
        font-size: 18px;
        color: rgba(255,255,255,0.9);
        margin-bottom: 20px;
        text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    .search-box {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
    }

    .search-box input {
        width: 520px;
        padding: 14px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    .search-box button {
        margin-left: 10px;
        padding: 14px 20px;
        border: none;
        background: #ff9a3c;
        color: #1e1e1e;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
    }

    .search-box button:hover {
        background: #ff7a18;
    }

    .examples {
        margin-top: 15px;
        color: #000;
        font-size: 14px;
    }

    .examples span {
        display: inline-block;
        margin: 5px;
        padding: 6px 10px;
        background: #ffffff;
        color: #000;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid rgba(0,0,0,0.08);
    }

    .examples span:hover {
        background: #f5f5f5;
    }

    .image img {
        display: none; /* hide inline preview when using full background hero */
    }

    .hero-top {
        padding-top: 60px;
        padding-bottom: 20px;
    }

    .hero-bottom {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
        position: relative;
        z-index: 1;
    }

    .homePage .search-box {
        margin: 0 auto 10px;
        max-width: 560px;
        width: 100%;
    }

    .examples {
        margin-top: 15px;
        color: #000;
        font-size: 14px;
    }

    .examples span {
        display: inline-block;
        margin: 5px;
        padding: 6px 10px;
        background: #ffffff;
        color: #000;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid rgba(0,0,0,0.08);
    }

    .examples span:hover {
        background: #f5f5f5;
    }
</style>

<script>
function fillSearch(text) {
    document.getElementById("searchInput").value = text;
}
</script>

<div class="wrapper">

    <div class="homePage">

        <div class="hero-top">
            <div class="subtitle">Search our travel brochures: destinations, attractions and tips</div>
        </div>

        <div class="hero-bottom">
            <form action="/search" method="get">
                <div class="search-box">
                    <input 
                        id="searchInput"
                        type="text" 
                        name="search" 
                        placeholder="Search destinations, attractions, places..." 
                        required>
                    <button type="submit">Search</button>
                </div>
            </form>

            <div class="examples">
            Try:
            <span onclick="fillSearch('Ladakh monasteries')">Ladakh monasteries</span>
            <span onclick="fillSearch('Hampi temples')">Hampi temples</span>
            <span onclick="fillSearch('Konaseema backwaters')">Konaseema backwaters</span>
        </div>
        </div>

        <div class="image">
            <img src="{{ url_for('static', filename='images/hero.svg') }}">
        </div>

    </div>

</div>

{% endblock %}
